{# Main navigation, shared by the page sidebar and the floating menu card on map pages #}
<div class="px-5 mb-2 text-xs font-semibold uppercase tracking-widest text-ink-400">เมนูหลัก</div>
<ul class="menu px-2 gap-1 w-full">
  <li>
    <a href="{{ url_for('sites.index') }}"
       class="text-base font-medium {% if request.endpoint == 'sites.index' %}bg-primary text-primary-content hover:bg-primary{% else %}text-ink-700 hover:bg-brand-50 hover:text-brand-600{% endif %}">
      <i class="ph ph-house text-xl"></i> หน้าแรก
    </a>
  </li>
  <li>
    <a href="{{ url_for('sites.monitor') }}"
       class="text-base font-medium {% if request.endpoint == 'sites.monitor' %}bg-primary text-primary-content hover:bg-primary{% else %}text-ink-700 hover:bg-brand-50 hover:text-brand-600{% endif %}">
      <i class="ph ph-chart-line text-xl"></i> ติดตามสถานการณ์
    </a>
  </li>
</ul>

{% if current_user.is_authenticated %}
<div class="px-5 mt-6 mb-2 text-xs font-semibold uppercase tracking-widest text-ink-400">การจัดการ</div>
<ul class="menu px-2 gap-1 w-full">
  <li>
    <a href="{{ url_for('zones.index') }}"
       class="text-base font-medium {% if request.endpoint and request.endpoint.startswith('zones.') %}bg-primary text-primary-content hover:bg-primary{% else %}text-ink-700 hover:bg-brand-50 hover:text-brand-600{% endif %}">
      <i class="ph ph-polygon text-xl"></i> จัดการโซน
    </a>
  </li>
  <li>
    <a href="{{ url_for('stations.index') }}"
       class="text-base font-medium {% if request.endpoint and request.endpoint.startswith('stations.') %}bg-primary text-primary-content hover:bg-primary{% else %}text-ink-700 hover:bg-brand-50 hover:text-brand-600{% endif %}">
      <i class="ph ph-broadcast text-xl"></i> จัดการสถานี
    </a>
  </li>
  <li>
    <a href="{{ url_for('system_settings.index') }}"
       class="text-base font-medium {% if request.endpoint and request.endpoint.startswith('system_settings.') %}bg-primary text-primary-content hover:bg-primary{% else %}text-ink-700 hover:bg-brand-50 hover:text-brand-600{% endif %}">
      <i class="ph ph-gear text-xl"></i> ตั้งค่าระบบ
    </a>
  </li>
</ul>
{% endif %}
